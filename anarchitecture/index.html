<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anarchitecture</title>
<meta name="description" content="Anarchitecture. Installation plan for an exhibition at the Benton Museum of Art at Pomona College. Rodrigo Penide Lema.">
<style>
/* One look on purpose: white ground, black drawing, Arial at one small size. Single theme. */
:root{--white:#fff;--black:#000;--grey:#8a8a8a;--block:#e9e9e9;--font:Arial,"Helvetica Neue",Helvetica,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--white);color:var(--black);font-family:var(--font);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
a,button{color:inherit;font:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--black);outline-offset:3px}

.corner{position:fixed;z-index:3;top:calc(22px + env(safe-area-inset-top,0px));left:max(24px,env(safe-area-inset-left,0px))}
.corner p{margin:0}
.corner-r{position:fixed;z-index:3;top:calc(22px + env(safe-area-inset-top,0px));right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:18px}
.corner-r a,.corner-r button{text-decoration:none}
.corner-r a:hover,.corner-r button:hover{text-decoration:underline}

/* home: the plan, alone, in the middle */
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:80px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.plan{position:relative;width:min(100%,1320px,calc((100vh - 160px) * 1.7407))}
.plan svg{display:block;width:100%;height:auto}
.pw{fill:var(--black)}
.pl{fill:none;stroke:var(--black);stroke-width:.5px;vector-effect:non-scaling-stroke}
.plus{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);display:grid;place-items:center}
.plus::before,.plus::after{content:"";position:absolute;background:var(--black);transition:transform .2s}
.plus::before{width:11px;height:1px}.plus::after{width:1px;height:11px}
.plus:hover::before,.plus:hover::after,.plus.on::before,.plus.on::after{transform:scale(1.6)}

/* the wall: a white page over the plan */
.page{position:fixed;inset:0;z-index:2;background:var(--white);overflow:auto;display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px)}
.tomb{position:fixed;z-index:3;bottom:calc(22px + env(safe-area-inset-bottom,0px));right:max(24px,env(safe-area-inset-right,0px));max-width:min(320px,calc(100vw - 48px));pointer-events:auto}
.tomb:not(:empty){background:rgba(255,255,255,.92);padding:10px 12px 11px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tomb p{margin:0}
.tomb .t{font-style:italic}
.tomb .long{margin-top:14px;max-width:38ch}
.tomb .where{color:var(--grey)}
.wallbox{min-height:100vh;min-height:100svh;box-sizing:border-box;padding-block:64px 200px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;justify-content:safe center;align-items:center;overflow-x:auto}
.wallbox svg{display:block;width:min(1800px,100%);height:auto;min-width:560px;overflow:visible}
.e-line{stroke:var(--black);stroke-width:1px;vector-effect:non-scaling-stroke;fill:none}
.e-floor{stroke:var(--black);stroke-width:2px;vector-effect:non-scaling-stroke}
.e-work{cursor:pointer;outline:none;transition:opacity .25s}
.e-work rect{fill:var(--block)}
.e-work.dim{opacity:.4}
.e-work:hover{opacity:1}
.e-work:focus-visible{outline:none}
.e-work:focus-visible rect{stroke:var(--black);stroke-width:1px;vector-effect:non-scaling-stroke}

.room3d{width:min(1100px,100%,calc((100vh - 330px) * 1.6));display:grid;gap:18px;justify-items:center}
.room3d canvas{display:block;width:100%;aspect-ratio:16/10;cursor:grab;touch-action:none}
.room3d canvas:active{cursor:grabbing}
.play{text-decoration:none}.play:hover{text-decoration:underline}

/* checklist: same page, plain list */
.list{padding-block:120px 80px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:36px 32px;max-width:1240px;margin:0 auto;width:100%}
.list p{margin:0}
.list .n{color:var(--grey)}
.list a{text-decoration:none;display:block}
.list a:hover .t{text-decoration:underline}
/* the plan: zones drawn as hairlines, dashed for proposals */
.zones .z{fill:none;stroke:var(--black);stroke-width:.6px;vector-effect:non-scaling-stroke}
.zones .z[fill]{fill:url(#hatch)}
.zones .d{stroke-dasharray:3 2}
.zones .s{stroke-width:2px}
.hl{stroke:var(--black);stroke-width:.4}

/* drawings: walls, the table */
.el{font-family:var(--font)}
.el .num{fill:var(--grey)}
.el .ttl{fill:var(--black)}
.el .ph{fill:var(--block)}
.el .frm{fill:#1c1c1c}
.el .mat{fill:#fff}
.el .lbl{fill:#fff}
.el .lbn{fill:var(--grey)}
.el .bar{fill:var(--grey)}
.el .lab{fill:none;stroke:var(--grey);stroke-width:.75px;vector-effect:non-scaling-stroke}
.el .glass{fill:rgba(150,200,190,.22);stroke:var(--black);stroke-width:1px;vector-effect:non-scaling-stroke}
.el .solid{fill:var(--black)}
.el .mon{fill:var(--black)}
.el .wire{stroke:var(--black);stroke-width:.5px;vector-effect:non-scaling-stroke;fill:none}
.el .hit{fill:transparent}
.el .bg{fill:transparent}
.el .edge{stroke:#111;stroke-width:1.6px;vector-effect:non-scaling-stroke;fill:none}
.el .shade{stroke:rgba(0,0,0,.12);stroke-width:.6px;vector-effect:non-scaling-stroke;fill:none}
.el .glab{cursor:pointer}
.wallbox svg.el{max-height:calc(100vh - 270px);overflow:hidden}
.wallbox svg.top{width:auto;min-width:0;height:min(calc(100vh - 190px),820px);max-width:100%}
.tomb .tb+.tb{margin-top:14px}
.tomb .n{color:var(--grey)}
.tomb .more{margin-top:8px}
.tomb .more a{text-decoration:none}.tomb .more a:hover{text-decoration:underline}

/* one work alone */
.obj{padding-block:90px 170px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;justify-items:center;gap:16px}
.obj .fig{width:min(1100px,100%);display:flex;justify-content:center;align-items:center;gap:24px}
.obj video.film{display:block;width:100%;max-height:min(66vh,720px);background:#000}
.obj img{display:block;width:100%;height:min(66vh,720px);object-fit:contain}
.obj .pair>*{flex:1 1 0;min-width:0}
.obj .ph{height:min(56vh,600px);max-width:100%;background:var(--block);display:grid;place-items:center;color:var(--grey)}
.obj .pair .ph{height:auto;width:100%}
.obj .cap,.room3d .n{color:var(--grey);margin:0}
.views,.ctl{display:flex;gap:8px 20px;flex-wrap:wrap;justify-content:center}
.views button,.ctl button,.ctl a{text-decoration:none}
.views button:hover,.ctl button:hover,.ctl a:hover,.views button[aria-pressed=true],.ctl button[aria-pressed=true]{text-decoration:underline}
.grp{max-width:1240px;margin:0 auto;width:100%}
.grp h2{font:inherit;color:var(--grey);margin:0;padding:0 max(24px,env(safe-area-inset-left,0px))}
.grp:first-child{padding-top:120px}
.grp .list{padding-block:14px 48px}
.list .t{font-style:italic}
body.open .corner{display:none}
@media (max-width:640px){.corner-r{gap:12px}.page{grid-template-rows:auto auto;align-content:start}.tomb{position:static;grid-row:2;margin:0 24px 32px;max-width:none;font-size:12px}#pagebody{grid-row:1}.wallbox{min-height:0;padding-block:72px 24px}.room3d{width:100%}.wallbox svg.el{max-height:none}}
.obj{cursor:pointer}.obj button,.obj a{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  const knot=[];// [alpha, polyline]
  const N=220;
  for(let j=0;j<=STEPS;j++){ // each tread: its front edge, and the riser top above it
    const lo=[],hi=[];for(let i=0;i<=N;i++){const t=TURN*i/N;lo.push(pt(t,j,false));if(j<STEPS)hi.push(pt(t,j,true));}
    knot.push([1,lo]);if(j<STEPS)knot.push([.55,hi]);}
  const foot=[];for(let i=0;i<=N;i++){const t=TURN*i/N,r=rad(t)+STEPS*TD,th=a0+t;foot.push([CC[0]+r*Math.cos(th),0,CC[2]+r*Math.sin(th)]);}
  knot.push([.3,foot]);
  for(let i=0;i<=Math.round(TURN/(Math.PI/14));i++){ // the plywood ribs, a profile every few feet
    const t=Math.min(TURN,i*Math.PI/14),pr=[];for(let j=0;j<STEPS;j++){pr.push(pt(t,j,false),pt(t,j,true));}pr.push(pt(t,STEPS,false));
    const back=pt(t,STEPS,false);pr.push([back[0],0,back[2]]);const fr=pt(t,0,false);pr.push([fr[0],0,fr[2]],fr);knot.push([.4,pr]);}
  function frame(now){
    if(auto&&!drag){const k=rel?Math.min(1,(now-t0)/2500):1;yaw=base+Math.sin((now-t0)/7000)*.35*k*k*(3-2*k);};
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
    for(const [a,p] of lines){g.strokeStyle=`rgba(0,0,0,${a})`;g.lineWidth=a<1?.6:1;g.beginPath();
      for(let i=0;i<p.length;i+=2){const u=proj(p[i]),v=proj(p[i+1]);g.moveTo(u[0],u[1]);g.lineTo(v[0],v[1]);}g.stroke();}
    // the proposed commission: the spiral of bleachers
    for(const [al,pl] of knot){g.strokeStyle=`rgba(0,0,0,${al})`;g.lineWidth=al===1?1.2:.7;g.beginPath();
      pl.forEach((q,i)=>{const u=proj(q);i?g.lineTo(u[0],u[1]):g.moveTo(u[0],u[1]);});g.stroke();}
    raf=requestAnimationFrame(frame);
  }
  cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};auto=false;cv.setPointerCapture(e.pointerId);});
  cv.addEventListener("pointermove",e=>{if(!drag)return;yaw=drag.yaw+(e.clientX-drag.x)*.006;pitch=Math.max(.08,Math.min(1.2,drag.pitch+(e.clientY-drag.y)*.004));});
  cv.addEventListener("pointerup",()=>{if(drag&&!window.matchMedia("(prefers-reduced-motion: reduce)").matches){auto=true;base=yaw;t0=performance.now();rel=true;}drag=null;});
  const ro=new ResizeObserver(size);ro.observe(cv);
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)auto=false;
  requestAnimationFrame(()=>{size();raf=requestAnimationFrame(frame);});
  roomStop=()=>{cancelAnimationFrame(raf);ro.disconnect();};
  return wrap;
}

let cleanup=null;
function stop(){stopRoom();if(cleanup){cleanup();cleanup=null;}}
function pick(i){
  if(!picks.length)return;sel=(i+picks.length)%picks.length;lastKey=String(picks[sel]);
  const o=body.querySelector(".obj");if(current&&current.options&&o){o.show(sel);tombstone(picks[sel],true);return;}
  const sc=body.querySelector(".scene");if(sc){sc.mark(picks[sel]);tombstone(picks[sel]);return;}
  body.querySelectorAll(".e-work").forEach((g,j)=>g.classList.toggle("dim",j!==sel));
  tombstone(picks[sel]);
}
function show(label){page.setAttribute("aria-label",label);page.hidden=false;document.body.classList.add("open");page.scrollTop=0;}
function openView(id){
  const v=VIEWS.find(x=>x.id===id);if(!v)return closePage();
  if(v.go){location.replace("#o-"+v.go);return;}
  const keep=lastKey;stop();current=v;sel=-1;picks=[];tombstone(null);body.innerHTML="";prevView=id;lastKey=keep;
  if(v.options)body.appendChild(drawOptions(v));
  else{const box=document.createElement("div");box.className="wallbox";
    box.appendChild(v.court?drawCourt(v):v.room&&v.room.w?drawRoom(v):v.scene?drawScene(v):drawWall(v));body.appendChild(box);
    box.addEventListener("click",e=>{if(e.target===box||e.target.classList.contains("room3d"))leave();});}
  if(fit){cleanup=fit();fit=null;}
  if(v.room&&v.room.w)tombstone(67);
  else if(v.court)tombstone("p-blackwell");
  else if(v.options)pick(0);
  else{let i=picks.findIndex(p=>String(p)===lastKey);if(i<0&&v.key)i=picks.findIndex(p=>String(p)===String(v.key));if(i>=0)pick(i);}
  show(v.label);cr.innerHTML=`<a href="#">Close</a>`;
}
function openObject(k){
  if(!C[k])return closePage();
  stop();current=null;picks=[];sel=-1;body.innerHTML="";
  body.appendChild(drawObj(k));tombstone(k,false);lastKey=String(k);
  const back=prevView||HOME[k];show(C[k].t);
  // a click on the work, or around it, goes back to the wall it came from
  body.firstChild.addEventListener("click",e=>{if(e.target.closest("button,a"))return;location.hash=back?"#"+back:"#";});
  cr.innerHTML=(back?`<a href="#${back}">Back</a>`:"")+`<a href="#">Close</a>`;
}
/* the checklist, room by room */
const R=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const GROUPS=[["106",[...R(1,26)]],["105",[...R(27,40),"41a","41b","41c","41d",...R(42,55)]],["104",R(56,61)],
  ["103",[62,63,64,"24b","p-girouard","p-contact","p-swept","p-anderson","p-notebook"]],["102",["p-suh",65,66]],["133",[67,68]],["Courtyard",["p-blackwell"]]];
function openList(){
  stop();current=null;picks=[];tombstone(null);prevView="checklist";lastKey=null;
  body.innerHTML=GROUPS.map(([g,ks])=>`<section class="grp"><h2>${g}</h2><div class="list">${ks.map(k=>{const c=C[k];
    return `<a href="#o-${k}"><p class="n">${esc(num(k))}</p><p>${esc(c.a)}</p><p><span class="t">${esc(c.t)}</span>${c.d?", "+esc(c.d):""}</p></a>`;}).join("")}</div></section>`).join("");
  show("Checklist");cr.innerHTML=`<a href="#">Close</a>`;
}
function closePage(){stop();page.hidden=true;document.body.classList.remove("open");current=null;prevView=null;lastKey=null;tombstone(null);body.innerHTML="";cr.innerHTML=`<a href="#checklist">Checklist</a>`;}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==="checklist")openList();
  else if(h.startsWith("o-"))openObject(h.slice(2));
  else if(VIEWS.some(v=>v.id===h))openView(h);
  else closePage();
}
document.addEventListener("keydown",e=>{
  if(page.hidden)return;
  if(e.key==="Escape"){const b=cr.querySelector("a");location.hash=b?b.getAttribute("href"):"";}
  if(picks.length&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const d=e.key==="ArrowRight"?1:-1;pick(sel<0?(d>0?0:picks.length-1):sel+d);}
  if(e.key==="Enter"&&body.querySelector(".scene")&&sel>=0)openObj(picks[sel]);
});
window.addEventListener("hashchange",route);route();
</script>
